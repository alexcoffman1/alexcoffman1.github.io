<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alex Coffman</title>
    <meta name="description" content="Alex Coffman builds software for the bail industry." />
    <meta name="theme-color" content="#FAF9F6" />
    <link rel="icon" href="assets/mark.png" />
    <style>
      :root {
        --bg: #faf9f6;
        --ink: #111111;
        --muted: #8a8a8a;
        --bio: #2a2a2a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: var(--bg);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1080px, calc(100% - 4.5rem));
        margin: 0 auto;
        padding: 3.6rem 0 2.5rem;
      }

      h1 {
        font-family: Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
        font-size: clamp(2.35rem, 5vw, 3.55rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }

      .bio {
        margin-top: 1.1rem;
        max-width: 46rem;
        color: var(--bio);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
        font-size: 1.06rem;
        line-height: 1.55;
      }

      .bio strong {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 700;
        color: var(--ink);
      }

      .avatar {
        width: 1.2em;
        height: 1.2em;
        margin: 0 0.28em;
        border-radius: 50%;
        object-fit: cover;
        display: inline-block;
        vertical-align: -0.22em;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 3.1rem;
        border-top: 1px solid var(--ink);
        border-left: 1px solid var(--ink);
      }

      .card {
        aspect-ratio: 1 / 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.35rem 1.4rem 1.25rem;
        border-right: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        background: var(--bg);
        color: inherit;
        text-decoration: none;
      }

      .card:hover {
        background: #f3f1eb;
      }

      .card:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -3px;
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .company {
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .mono {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: var(--ink);
        color: var(--bg);
        font-size: 0.52rem;
        font-weight: 650;
        letter-spacing: 0.04em;
      }

      .figure {
        font-family: Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
        font-size: clamp(2.7rem, 6.4vw, 4.15rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.92;
        white-space: nowrap;
      }

      .figure span {
        font-size: 0.38em;
        letter-spacing: -0.02em;
        margin-left: 0.06em;
      }

      .meta {
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.4;
      }

      footer {
        margin-top: 4.25rem;
        color: #b3b3b3;
        font-size: 0.92rem;
      }

      @media (max-width: 860px) {
        .page {
          width: min(1080px, calc(100% - 2.4rem));
          padding-top: 2.4rem;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Alex Coffman</h1>
        <p class="bio">
          <strong>Alex Coffman</strong><img class="avatar" src="assets/alex.jpg" alt="" width="22" height="22" /> builds software for the bail industry.
        </p>
      </header>

      <main class="grid">
        <a class="card" href="https://bailhq.us">
          <div class="card-top">
            <span class="company">BailHQ</span>
            <span class="mono" aria-hidden="true">HQ</span>
          </div>
          <div class="figure">$100<span>/mo</span></div>
          <p class="meta">
            current (CEO)<br />
            founder (Texas)
          </p>
        </a>

        <a class="card" href="https://bailmarket.com">
          <div class="card-top">
            <span class="company">Bail Market</span>
            <span class="mono" aria-hidden="true">BM</span>
          </div>
          <div class="figure">254</div>
          <p class="meta">
            current (marketplace)<br />
            operating (Texas)
          </p>
        </a>

        <a class="card" href="https://bailx.us">
          <div class="card-top">
            <span class="company">BailX</span>
            <span class="mono" aria-hidden="true">BX</span>
          </div>
          <div class="figure">LIVE</div>
          <p class="meta">
            current (infrastructure)<br />
            operating (Texas)
          </p>
        </a>
      </main>

      <footer>
        <p>Writing soon.</p>
      </footer>
    </div>
  </body>
</html>
